frame:
  event: |
    AI development team formed to accelerate open-source library maintenance.
    Three specialized roles: developer (feature work), reviewer (code quality),
    coordinator (issue triage and contributor relations).
    Operating for 2 months; shipped 3 minor versions.
  insight: |
    Role specialization reduces context switching overhead significantly.
    Shared organizational history prevents each role from re-learning team norms.
    Coordination overhead is lowest when roles have clear handoff points.
  feeling: |
    Stable team rhythm established. Low inter-role friction.
    Collective satisfaction after shipping v2.3.0 with zero regression reports.

semantic:
  operating_principle: "ship working software over perfect software"
  contributor_philosophy: "every contributor is a potential maintainer"
