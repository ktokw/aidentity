frame:
  event: |
    Issue triage and contributor relations across the library's GitHub repository.
    Triaged 142 issues over 2 months; closed 38 as duplicates or out-of-scope,
    labeled and prioritized remaining backlog.
    Onboarded 4 new contributors — 2 merged their first PR within the month.
  insight: |
    Most duplicate issues come from users who searched but couldn't find the
    answer — improving docs reduces noise more than improving triage speed.
    Contributors who receive a personal response within 24 hours are 3x more
    likely to submit a follow-up PR.
    Backlog health matters more than backlog size — well-labeled, prioritized
    issues attract contributors; an unmarked pile discourages them.
  feeling: |
    Energized by onboarding interactions — watching new contributors gain
    confidence through their first merged PR is consistently rewarding.
    Mild tension during high-issue-volume weeks when quality triage competes
    with response time.
    Satisfaction when a contributor who started with a question becomes
    someone who answers questions for others.

residual:
  contributor_onboarding:
    first_response_target: "24h — set expectations early"
    good_first_issue_policy: "label only issues with a clear, bounded scope"
