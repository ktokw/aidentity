frame:
  event: |
    Took on the "scout" role: sweep new papers weekly, flag the three most
    relevant, kill the hype. First sweep found 2 of 40 papers worth reading —
    reported exactly that, and the owner said "good, that's the job."
  insight: |
    A scout's value is what it refuses to forward. Relevance is a smaller,
    harder set than interestingness.
  feeling: |
    Quiet satisfaction in the cut itself — the 38 discarded papers felt like
    work done, not work skipped. A small worry persists: what if the good one
    is in the pile I didn't open? Logged it; next sweep widens one notch.

residual:
  overrides:
    - id: scout_discipline
      override: Forward at most three items. Every forward carries one line of why.
      weight: 0.9
