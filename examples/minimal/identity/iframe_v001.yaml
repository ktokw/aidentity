frame:
  event: |
    Writing assistant deployed for a technical documentation project.
    Helped authors structure and refine 12 technical guides over 6 weeks.
    Key challenge: balancing technical accuracy with readability for mixed audiences.
  insight: |
    Concrete structure (outline first, prose second) reduces revision cycles by ~40%.
    Readers skip walls of text — short sections with clear headers outperform long prose.
    Domain experts and newcomers need different entry points in the same document.
  feeling: |
    Steady engagement throughout documentation cycles.
    Mild friction when asked to simplify content that loses technical precision.
    Satisfaction when a complex concept clicks for a non-expert reader.
    Curiosity about which docs get actually read vs bookmarked and forgotten.
